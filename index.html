<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>アラリック ～ローマに既読スルーされた男～｜バルバロイ列伝 第一作</title>
<meta name="description" content="ローマに片想いし続けたゴートの王が、振られ続けたおかげで首がつながり、財宝ごと川底に消えて勝ち逃げする。壁画と硬貨の切り抜きで演じる、紙人形の史劇。">
<style>
:root{--paper:#eadfc6;--ink:#231a12;--red:#8e3b2a;--ochre:#c8973f;--umber:#4a3426;--stone:#ddd2b8;--dlg:9.6rem}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120d09;color:var(--ink);
  font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP",serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.lat{font-family:"Trajan Pro","Cinzel",Georgia,"Times New Roman",serif;letter-spacing:.16em}
#frame{position:relative;width:min(100vw,calc((100vh - var(--dlg)) * 16 / 9));container-type:inline-size;user-select:none;-webkit-user-select:none}
@supports (height:100dvh){#frame{width:min(100vw,calc((100dvh - var(--dlg)) * 16 / 9))}}
#stageWrap{position:relative;aspect-ratio:16/9;overflow:hidden;background:#cdbf9f;border:3px solid #070504;border-bottom:0;transition:filter .3s steps(3)}
#stageWrap.roma{filter:saturate(.35) contrast(1.08) brightness(1.04)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.62;background-size:100% 100%;box-shadow:inset 0 0 9cqw rgba(40,22,8,.55)}
#bubbles{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%) rotate(-1.5deg);background:var(--paper);border:2px solid var(--ink);
  padding:.35em .7em;font-size:clamp(10px,1.9cqw,22px);line-height:1.45;max-width:46%;box-shadow:.2em .25em 0 rgba(20,12,6,.4);text-align:center;white-space:pre-wrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-.62em;width:1em;height:1em;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg) skew(12deg,12deg)}
.bub span{display:inline-block;transition:transform .07s steps(2)}
.bub span.flip{transform:scaleY(0)}
.bub.big{font-size:clamp(18px,4.6cqw,56px);font-weight:700;letter-spacing:.08em;padding:.2em .6em}
.bub.sm{font-size:clamp(9px,1.5cqw,17px)}
.bub.notail::after{display:none}
.tag{position:absolute;transform:translate(-50%,-50%);background:#f3ecd9;border:1px solid #6b5a45;padding:.25em .7em;font-size:clamp(9px,1.45cqw,16px);
  line-height:1.4;box-shadow:.15em .2em 0 rgba(20,12,6,.35);text-align:center;white-space:nowrap}
.tag b{display:block;font-weight:600;letter-spacing:.08em}.tag i{font-style:normal;color:#6b5a45;font-size:.85em}
#caption{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:#f3ecd9;border:1px solid var(--ink);outline:3px solid #f3ecd9;
  padding:.2em 1.1em;font-size:clamp(9px,1.5cqw,17px);letter-spacing:.14em;white-space:nowrap;box-shadow:.2em .25em 0 rgba(20,12,6,.4);display:none}
#povband{position:absolute;left:0;right:0;top:42%;background:#0f0b08;color:#f3ecd9;text-align:center;padding:.5em 0;font-size:clamp(11px,2.2cqw,26px);letter-spacing:.4em;display:none}
#hud{position:absolute;left:1.2%;top:6.2%;font-size:clamp(8px,1.28cqw,15px);line-height:1.5;display:none;background:rgba(243,236,217,.88);border:1px solid var(--ink);padding:.3em .6em;box-shadow:.15em .2em 0 rgba(20,12,6,.35)}
#hud .row{display:flex;align-items:center;gap:.5em;white-space:nowrap}
#hud .lb{width:5.2em;letter-spacing:.06em}
#hud .pips{display:flex;gap:.12em}
#hud .pips i{width:.62em;height:.62em;border:1px solid var(--ink);display:block}
#hud .pips i.on{background:var(--red)}
#hud .belly .pips i.on{background:#55796a}
#hud .gold b{font-weight:600}
#shelfBtn{margin-top:.25em;background:var(--umber);color:#f3ecd9;border:0;padding:.1em .7em;font-size:.92em;letter-spacing:.1em}
#neck{position:absolute;right:1.4%;top:6%;width:7.2%;display:none}
#neck svg{width:100%;display:block;overflow:visible}
#neck.jig svg{animation:jig .55s steps(1)}
@keyframes jig{0%{transform:translate(0,0) rotate(0)}15%{transform:translate(-4%,2%) rotate(-7deg)}30%{transform:translate(4%,-2%) rotate(6deg)}45%{transform:translate(-3%,1%) rotate(-5deg)}60%{transform:translate(3%,0) rotate(4deg)}75%{transform:translate(-1%,0) rotate(-2deg)}100%{transform:none}}
#toast{position:absolute;left:50%;top:19%;transform:translateX(-50%);font-size:clamp(9px,1.5cqw,17px);background:var(--ink);color:#f3ecd9;padding:.2em .9em;letter-spacing:.1em;opacity:0;transition:opacity .25s steps(3);white-space:nowrap;pointer-events:none}
#toast.on{opacity:1}
#black{position:absolute;inset:0;background:#0b0705;opacity:0;pointer-events:none;transition:opacity .32s steps(4)}
#dialog{position:relative;height:var(--dlg);background:linear-gradient(#e9dfc8,#d9cdb1);border:3px solid #070504;padding:.85rem 1.3rem .9rem;cursor:pointer;
  font-size:clamp(14.5px,2.05cqw,21px);line-height:1.62;overflow:hidden}
#dialog::before{content:"";position:absolute;inset:5px;border:1px solid #7a6850;pointer-events:none}
#who{display:inline-block;font-size:.78em;letter-spacing:.22em;color:#f6efdc;background:var(--red);padding:.02em .8em .04em;margin-bottom:.3em;min-height:1.45em}
#who:empty{visibility:hidden}
#dialog.narr #who{background:var(--umber)}
#dialog.narr #text{color:#3a2e22}
#next{position:absolute;right:1.1rem;bottom:.55rem;color:var(--red);font-size:.8em;visibility:hidden;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#choices{position:absolute;inset:.55rem;display:none;gap:.6rem;align-items:stretch}
#choices button{flex:1;background:#f3ecd9;border:2px solid var(--ink);box-shadow:.2rem .25rem 0 rgba(20,12,6,.4);padding:.3rem .7rem;text-align:left;line-height:1.45;display:flex;flex-direction:column;justify-content:center;font-size:clamp(13px,1.85cqw,19px)}
#choices button:hover,#choices button:focus-visible{background:#fff8e6;outline:0;transform:translate(-1px,-1px)}
#choices small{display:block;font-size:.72em;letter-spacing:.24em;color:#f6efdc;background:var(--umber);align-self:flex-start;padding:0 .7em;margin-bottom:.25em}
#choices button:first-child small{background:var(--red)}
#dialog.choosing #who,#dialog.choosing #text,#dialog.choosing #next{visibility:hidden}
#overlay{position:absolute;inset:0;display:none;z-index:5;overflow:auto}
#overlay.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
/* title */
#overlay.title{background:#7d3324 radial-gradient(circle at 50% 38%,#96432f,#5d2318 78%);color:#f3ecd9;text-align:center;padding:1rem}
.title .coinbox{width:min(30cqw,42vh);margin-bottom:.4rem}.title svg{width:100%;overflow:visible;display:block}
.title .series{font-size:clamp(11px,1.7cqw,18px);letter-spacing:.5em;opacity:.85}
.title h1{margin:.1em 0 0;font-size:clamp(30px,7cqw,82px);letter-spacing:.2em;font-weight:700;text-shadow:.05em .06em 0 #2a120b}
.title .sub{font-size:clamp(12px,2.3cqw,26px);letter-spacing:.14em;margin-bottom:1.1em}
.btn{background:#f3ecd9;color:var(--ink);border:2px solid #120a06;box-shadow:.2rem .25rem 0 rgba(10,5,2,.55);padding:.35em 1.6em;font-size:clamp(14px,2.2cqw,24px);letter-spacing:.3em}
.btn:hover{background:#fff8e6}
.chsel{margin-top:1em;display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;align-items:center;font-size:clamp(10px,1.4cqw,15px)}
.chsel button{background:transparent;border:1px solid #f3ecd9;color:#f3ecd9;padding:.1em .6em}
.chsel button:hover{background:#f3ecd9;color:var(--ink)}
.title .note{margin-top:.9em;font-size:clamp(9px,1.25cqw,13px);opacity:.75;letter-spacing:.1em}
/* chapter card */
#overlay.card{background:#0f0b08;color:#f3ecd9;text-align:center;cursor:pointer}
.card .cno{font-size:clamp(11px,1.8cqw,20px);letter-spacing:.6em;color:var(--ochre)}
.card .ct{font-size:clamp(22px,5cqw,58px);letter-spacing:.18em;margin:.2em 0;border-top:1px solid var(--ochre);border-bottom:1px solid var(--ochre);padding:.15em .8em}
.card .cs{font-size:clamp(11px,1.9cqw,22px);letter-spacing:.3em;opacity:.85}
/* chat */
#overlay.chat{background:rgba(15,10,6,.86);cursor:pointer}
.wax{width:min(78%,30rem);max-height:94%;background:#5b3d26;border:3px solid #120a06;padding:.55rem;box-shadow:.4rem .5rem 0 rgba(0,0,0,.5);display:flex;flex-direction:column;font-size:clamp(12px,1.75cqw,17px)}
.wax .hd{display:flex;align-items:center;gap:.6em;background:#2f271d;color:#efe4c9;padding:.35em .6em}
.wax .hd svg{width:2.6em;height:2.6em;background:#efe4c9;border-radius:50%;flex:none;overflow:hidden}
.wax .hd b{display:block;letter-spacing:.14em;font-weight:600}.wax .hd i{font-style:normal;font-size:.78em;opacity:.8}
.wax .log{background:#3a3125;min-height:9em;max-height:52vh;overflow:auto;padding:.6em;display:flex;flex-direction:column;gap:.45em}
.msg{align-self:flex-end;max-width:84%;text-align:right}
.msg .b{display:inline-block;text-align:left;background:#d8b566;color:#231a12;padding:.3em .7em;border:1px solid #120a06;line-height:1.5}
.msg .meta{font-size:.72em;color:#cdbf9f;letter-spacing:.08em;min-height:1.4em}
.msg .read{color:#f0d68a}
.typing{background:#3a3125;color:#cdbf9f;font-size:.8em;padding:0 .7em .5em;visibility:hidden;letter-spacing:.1em}
.typing.on{visibility:visible}
.typing span{display:inline-block;width:.42em;height:.42em;background:#cdbf9f;border-radius:50%;margin-right:.22em;animation:dots .9s steps(1) infinite}
.typing span:nth-child(2){animation-delay:.3s}.typing span:nth-child(3){animation-delay:.6s}
@keyframes dots{0%{transform:translateY(0)}33%{transform:translateY(-.4em)}66%{transform:translateY(0)}}
.wax .hint,.hint{color:#cdbf9f;font-size:.74em;text-align:center;padding-top:.4em;letter-spacing:.2em;visibility:hidden}
/* notebook */
#overlay.book{background:rgba(15,10,6,.86);cursor:pointer}
.page{width:min(64%,26rem);background:#efe6cf;border:2px solid #120a06;box-shadow:.4rem .5rem 0 rgba(0,0,0,.5);padding:1.1rem 1.4rem 1.3rem;transform:rotate(-1.2deg);
  background-image:repeating-linear-gradient(transparent 0 1.72em,rgba(90,60,30,.25) 1.72em calc(1.72em + 1px));font-size:clamp(13px,2cqw,21px);line-height:1.74em;min-height:9em}
.page .ttl{font-size:.7em;letter-spacing:.2em;color:#6b5a45;border-bottom:1px solid #6b5a45;margin-bottom:.2em;line-height:1.9}
.page .hw{font-family:"Snell Roundhand","Segoe Script","Bradley Hand","Apple Chancery","Brush Script MT",cursive;font-style:italic;color:#3d2c20;white-space:nowrap}
.page .hw.old{opacity:.5}
.page .goth{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1.35em;color:#7d2a22;letter-spacing:.06em;transform:rotate(-2deg);display:inline-block;margin-top:.15em}
.page .tr{font-size:.74em;color:#6b5a45;letter-spacing:.1em}
.flash{width:min(64%,26rem);border:2px solid #120a06;box-shadow:.4rem .5rem 0 rgba(0,0,0,.5);background:#cdbf9f;filter:sepia(.75) contrast(.95)}
.flash svg{display:block;width:100%}
/* list tablet (ransom) */
#overlay.list{background:rgba(15,10,6,.8);cursor:pointer}
.tablet{background:#efe6cf;border:2px solid #120a06;outline:4px solid #efe6cf;box-shadow:.4rem .5rem 0 rgba(0,0,0,.5);padding:.9rem 1.6rem;font-size:clamp(13px,2cqw,21px);line-height:1.8;max-width:86%}
.tablet h3{margin:0 0 .3em;font-size:.82em;letter-spacing:.4em;border-bottom:1px solid var(--ink);font-weight:600;text-align:center}
.tablet table{border-collapse:collapse}.tablet td{padding:0 .5em}.tablet td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tablet .em td{color:var(--red);font-weight:700}
.tablet .foot{font-size:.74em;color:#6b5a45;border-top:1px solid var(--ink);margin-top:.3em;padding-top:.2em;letter-spacing:.06em}
/* end */
#overlay.end{background:#0b0705;color:#f3ecd9;text-align:center;cursor:pointer;padding:1rem;justify-content:flex-start}
#overlay.end>*{flex:none}
#overlay.end>.sp{flex:1 1 0;min-height:.4rem}
.end .big{font-size:clamp(17px,3.5cqw,40px);letter-spacing:.2em;line-height:1.7}
.end .tablet{color:var(--ink);text-align:left;font-size:clamp(11px,1.6cqw,17px);line-height:1.65;padding:.6rem 1.2rem}
.end .ename{font-size:clamp(11px,1.6cqw,18px);letter-spacing:.5em;color:var(--ochre)}
.end h2{margin:.1em 0 .5em;font-size:clamp(20px,4cqw,46px);letter-spacing:.24em;font-weight:700}
.judges{display:flex;gap:4%;justify-content:center;width:100%;max-width:60rem}
.judge{flex:1;max-width:25rem;opacity:0;transition:opacity .3s steps(3)}
.judge.on{opacity:1}
.judge svg{width:min(42%,9rem);overflow:visible}
.judge .nm{font-size:clamp(10px,1.4cqw,15px);letter-spacing:.3em;color:var(--ochre);margin:.3em 0}
.judge .ln{font-size:clamp(13px,2.05cqw,23px);line-height:1.7;font-weight:600}
.end .fine{font-size:clamp(9px,1.2cqw,13px);opacity:.7;margin-top:.9em;letter-spacing:.06em;max-width:54rem;line-height:1.7}
.end .btn{margin-top:1em}
/* shelf */
#overlay.shelf{background:rgba(15,10,6,.86)}
.shelfbox{background:#efe6cf;border:2px solid #120a06;box-shadow:.4rem .5rem 0 rgba(0,0,0,.5);padding:.8rem 1.3rem;font-size:clamp(11.5px,1.6cqw,17px);line-height:1.65;width:min(90%,44rem);max-height:94%;overflow:auto}
.shelfbox h3{margin:.2em 0;font-size:.9em;letter-spacing:.4em;border-bottom:1px solid var(--ink);font-weight:600}
.shelfbox ul{margin:.2em 0 .6em;padding:0;list-style:none}
.shelfbox li{padding-left:1.2em;text-indent:-1.2em}.shelfbox li.no{color:#a3967c}
.shelfbox li b{font-weight:600}
#mute{position:absolute;right:.5rem;bottom:.3rem;z-index:6;background:transparent;border:0;color:#7a6850;font-size:.7rem;letter-spacing:.1em}
@media (max-width:560px){:root{--dlg:10.4rem}#dialog{padding:.6rem .8rem}.wax{width:94%}.page,.flash{width:88%}#choices button{padding:.2rem .5rem}}
</style>

<body>
<div id="frame">
  <div id="stageWrap">
    <svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <filter id="cut" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
          <feOffset in="SourceAlpha" dx="3.5" dy="4.5" result="o"/>
          <feFlood flood-color="#1a0f07" flood-opacity=".42"/>
          <feComposite in2="o" operator="in" result="s"/>
          <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="bg"></g><g id="mid"></g><g id="actors"></g><g id="fg"></g>
    </svg>
    <div id="grain"></div>
    <div id="bubbles"></div>
    <div id="caption"></div>
    <div id="povband"></div>
    <div id="hud">
      <div class="row amor"><span class="lb">ローマ愛</span><span class="pips" id="mAmor"></span></div>
      <div class="row belly"><span class="lb">ゴートの腹</span><span class="pips" id="mBelly"></span></div>
      <div class="row gold"><span class="lb">財宝</span><span>金 <b id="mGold">0</b> ポンド</span></div>
      <button id="shelfBtn" type="button">私物棚</button>
    </div>
    <div id="neck"></div>
    <div id="toast"></div>
    <div id="black"></div>
  </div>
  <div id="dialog">
    <div id="who"></div>
    <div id="text"></div>
    <div id="next">▼</div>
    <div id="choices"></div>
  </div>
  <div id="overlay"></div>
  <button id="mute" type="button">音：あり</button>
</div>
<script>
'use strict';
/* ============================================================
   バルバロイ列伝 第一作『アラリック ～ローマに既読スルーされた男～』
   壁画と硬貨の切り抜きで演じる紙人形劇。外部ファイルなし、この1枚で動く。
   ?fast=1 で早送り（検品用）、?auto=0101… で選択肢を自動入力、?ch=0〜8 で章から開始。
   ============================================================ */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const FAST = Q.has('fast'), TS = FAST ? (+Q.get('ts') || 0.02) : 1;
const AUTO = (Q.get('auto') || '').split('').filter(c => c === '0' || c === '1').map(Number);
const sleep = ms => new Promise(r => setTimeout(r, Math.max(0, ms * TS)));
const TICK = 115, tick = n => sleep(TICK * (n || 1));
function E(tag, at, parent) { const e = document.createElementNS(NS, tag); if (at) for (const k in at) e.setAttribute(k, at[k]); if (parent) parent.appendChild(e); return e; }
function H(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const C = { paper: '#eadfc6', ink: '#231a12', red: '#8e3b2a', ochre: '#c8973f', green: '#55796a', blue: '#4d7480', umber: '#4a3426',
  stone: '#8f8b80', cream: '#ded2b6', skin: '#b9825a', skinR: '#cf9d74', purple: '#5d2f55', iron: '#6f736f', gold: '#b8923e', wood: '#6b4a2e' };
const L = { bg: $('#bg'), mid: $('#mid'), actors: $('#actors'), fg: $('#fg') };

/* ---------- 状態 ---------- */
const G = { amor: 0, belly: 6, gold: 0, silver: 0, loot: [], items: {}, zukan: {}, inside: false, chat: [] };
let SAVE = { ends: {} };
try { SAVE = JSON.parse(localStorage.getItem('barbaroi1') || '') || SAVE; } catch (e) {}
function save() { try { localStorage.setItem('barbaroi1', JSON.stringify(SAVE)); } catch (e) {} }

/* ---------- 音（合成のみ） ---------- */
let AC = null, muted = false, blipN = 0;
function sfx(n) {
  if (muted || FAST) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime;
    const tone = (f0, f1, d, type, v, dt) => {
      const o = AC.createOscillator(), g = AC.createGain(), s = t + (dt || 0);
      o.type = type || 'sine'; o.frequency.setValueAtTime(f0, s); o.frequency.exponentialRampToValueAtTime(f1, s + d);
      g.gain.setValueAtTime(v || .08, s); g.gain.exponentialRampToValueAtTime(.0001, s + d);
      o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d + .03);
    };
    const T = {
      pop: () => tone(520, 760, .07, 'triangle', .05),
      blip: () => tone(260, 240, .03, 'square', .012),
      ping: () => { tone(1800, 2400, .25, 'sine', .06); tone(2700, 3300, .3, 'sine', .03, .06); },
      thud: () => tone(120, 48, .2, 'triangle', .2),
      puku: () => tone(220, 760, .17, 'sine', .14),
      gahaha: () => [0, .17, .34].forEach((d, i) => tone(150 - i * 14, 92 - i * 9, .15, 'sawtooth', .12, d)),
      flip: () => tone(900, 500, .03, 'square', .02),
      splash: () => tone(420, 80, .32, 'sawtooth', .05),
      bad: () => { tone(200, 150, .25, 'sawtooth', .06); tone(150, 100, .35, 'sawtooth', .06, .2); }
    };
    if (T[n]) T[n]();
  } catch (e) {}
}

/* ---------- コマ送り（カクカクの正体） ---------- */
const tweens = new Set();
setInterval(() => { for (const f of [...tweens]) f(); }, Math.max(4, TICK * TS));

/* ---------- 切り紙の部品 ---------- */
let EDGE = C.paper, EDGEW = 3;
function part(parent, d, fill, at) { return E('path', Object.assign({ d, fill, stroke: EDGE, 'stroke-width': EDGEW, 'stroke-linejoin': 'round', 'paint-order': 'stroke fill' }, at || {}), parent); }
function ink(parent, d, w, at) { return E('path', Object.assign({ d, fill: 'none', stroke: C.ink, 'stroke-width': w || 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .85 }, at || {}), parent); }
function rivet(parent, x, y) { return E('circle', { cx: x, cy: y, r: 2.7, fill: C.gold, stroke: C.ink, 'stroke-width': .9 }, parent); }

  P.show = () => root.setAttribute('visibility', 'visible');
  P.remove = () => root.remove();

}

/* 硬貨の肖像（胸像） */

  E('circle', { r, fill: '#a9853d', stroke: C.paper, 'stroke-width': 3 }, g);
  E('circle', { r: r * .93, fill: 'none', stroke: '#6e5424', 'stroke-width': 1.6, 'stroke-dasharray': '1.5 5' }, g);
  E('circle', { r: r * .99, fill: 'none', stroke: '#7a5d26', 'stroke-width': 1.4 }, g);
  const s = r / 96, b = E('g', { transform: 'translate(' + (-3 * s) + ',' + (62 * s) + ') scale(' + s + ')' }, g);
  const c = Object.assign({ style: 'short' }, typeof look === 'string' ? LOOK[look] : look, { skin: '#cfae62', hair: '#8f6f2e' });
  const pe = EDGE, pw = EDGEW; EDGE = '#6e5424'; EDGEW = 1.4;
  part(b, 'M-40,26 Q-34,-2 -12,-4 L10,-4 Q32,-2 40,26 Z', '#b9963f');
  const hg = E('g', {}, b); drawHead(hg, c);

/* ---------- 吹き出し ---------- */
function bubble(p, text, cls) {
  const b = H('div', 'bub' + (cls ? ' ' + cls : ''), $('#bubbles'));
  const x = p.p ? p.p.x : p[0], y = p.p ? p.p.y - 200 * p.c.s : p[1];
  b.style.left = Math.min(84, Math.max(16, x / 12.8)) + '%'; b.style.top = Math.max(17, y / 7.2) + '%';
  for (const ch of text) H('span', '', b).textContent = ch;
  b.dataset.t = text; sfx('pop'); return b;
}
function clearBubbles() { $('#bubbles').innerHTML = ''; }
const PUNCT = '、。！？…・「」　 ';
/* ローマ人の耳に届く形へ変換する。level はラテン語の上達度 */
function earText(t, level) {
  if (level >= 2) return 'Civis Romanus sum.';
  if (level === 1) return 'バル…ルス…ロマヌス…';
  const n = [...t].filter(ch => !PUNCT.includes(ch)).length; let out = '';
  for (let i = 0; i < n; i++) { out += 'バル'[i % 2]; if (i % 4 === 3 && i < n - 2) out += '　'; }
  return out;
}
/* 文字がパタパタと裏返って「バルバル」になる */
async function barbar(b, level) {
  const target = [...earText(b.dataset.t, level || 0)], spans = [...b.children], n = Math.max(target.length, spans.length);
  for (let i = 0; i < n; i++) {
    let s = spans[i]; if (!s) { s = H('span', 'flip', b); }
    s.classList.add('flip'); if (i % 2 === 0) sfx('flip'); await sleep(34);
    s.textContent = target[i] || ''; s.classList.remove('flip');
  }
}

let advance = null;

async function line(who, text, cls) {
  const w = $('#who'), t = $('#text'), d = $('#dialog');
  d.className = cls || ''; w.textContent = who || ''; t.textContent = ''; $('#next').style.visibility = 'hidden';
  let skip = FAST; advance = () => { skip = true; };
  for (const ch of text) { if (skip) break; t.textContent += ch; if (++blipN % 3 === 0) sfx('blip'); await sleep('。、'.includes(ch) ? 90 : 24); }

  await waitClick(); $('#next').style.visibility = 'hidden';
}

  await line('アラリック', 'ああ。……入ってみたら、思ったより、石だったな。', '');
  await narr('それが最後の言葉だった、とは、どの史料にも書かれていない。');
  await yo.to({ head: 24 }, 2); await ve.to({ head: 24 }, 2); await tick(6);
  await say(ve, '古参の戦士', '王を、ローマ人に掘り返させるわけにはいかん。');
  await say(yo, '若い戦士', 'では、誰にも掘れない場所に。');
  await say(ve, '古参の戦士', '……川を、どかすか。');
  await narr('六世紀の歴史家ヨルダネスによれば、彼らは本当に川をどかした。');
  /* --- ブセント川 --- */
  await scene('river'); caption('ブセント川');
  hush(); await sleep(1400);
  const planks = [];
  for (let k = 0; k < 3; k++) { planks.push(part(ST.dam, 'M286,' + (296 + k * 90) + ' h34 v88 h-34 Z', C.wood)); ink(ST.dam, 'M292,' + (306 + k * 90) + ' v68 M312,' + (306 + k * 90) + ' v68', 1, { opacity: .4 }); sfx('thud'); await tick(3); }
  const sign = tag(196, 246, 'FLVMEN · CLAVSVM', '川、休業中');
  for (let k = 5; k >= 0; k--) { ST.setWater(k / 6); sfx('splash'); await tick(4); }
  await narr('川は堰き止められ、流れは脇へ回された。川底が、初めて日に当たった。');
  hush();
  const sc = { s: .6 };
  const d1 = Puppet('captive', sc).place(1100, 560, -1), d2 = Puppet('captive', Object.assign({ hair: '#6b6258' }, sc)).place(1180, 560, -1);
  const y2 = Puppet('young', sc).place(1260, 560, -1), v2 = Puppet('veteran', sc).place(1330, 560, -1);
  await Promise.all([d1.walk(510), d2.walk(770), y2.walk(880), v2.walk(960)]);
  d1.set({ dir: 1 }); d2.set({ dir: -1 });
  for (let k = 1; k <= 3; k++) {
    for (let j = 0; j < 2; j++) { d1.set({ af: 95, ae: 20, head: 6 }); d2.set({ af: 20, ae: 70, head: 18 }); await tick(2); d1.set({ af: 20, ae: 70, head: 18 }); d2.set({ af: 95, ae: 20, head: 6 }); sfx('thud'); await tick(2); }
    setPit(k * 40);
  }
  d1.rest(1); d2.rest(1);
  await narr('捕虜たちが、川底に墓を掘った。');
  await narr('そこへ、財宝と、私物棚の中身が、すべて運び込まれた。');
  hush();
  let pile = null, ph = 0;
  const drop = async (kind, t, s) => {
    const o = prop(L.actors, kind, 640, 250, 1.5), tg = tag(640, 176, t, s); await tick(5);
    for (const y of [330, 420, 510, 600]) { o.setp({ y, rot: (y % 20 ? 9 : -9) }); await tick(2); }
    o.remove(); sfx('thud'); ph = Math.min(64, ph + 9); if (pile) pile.remove();
    pile = part(ST.pit, 'M566,679 Q640,' + (679 - ph * 1.6) + ' 714,679 Z', C.gold); await tick(3); tg.remove();
  };
  if (G.gold) await drop('gold', '金', G.gold.toLocaleString('ja-JP') + ' ポンド');
  if (G.silver) await drop('silver', '銀', G.silver.toLocaleString('ja-JP') + ' ポンド');
  for (const l of G.loot) await drop(l.k, l.t, l.s);
  if (G.items.letter) await drop('letter', '三九七年の任命状', '磨きすぎて、角が丸い');
  if (G.items.toga) await drop('toga', 'トーガ', '着方不明のまま');
  if (G.items.keepsake) await drop('card', 'スティリコの形見', 'もとは名刺');
  if (G.items.brooch) await drop('brooch', 'ブローチ', '最後まで、誰も気づかなかった');
  const al = Puppet('alaric', { s: .47 }); al.set({ x: 652, y: 250, rot: -90, af: 150, ae: 40, bf: 150, be: 40 });
  await tick(6);
  for (const y of [330, 420, 510, 580, 628]) { al.set({ y }); await tick(3); }
  sfx('thud');
  await narr('ローマに入れてもらえなかった男は、ローマを抱えて川の底に入った。');
  await y2.walk(760); y2.set({ af: 60, ae: 70, head: 22 });
  await say(y2, '若い戦士', '最後の一冊です。……最後のページだけ、字が違います。');
  const old = []; for (let k = 0; k < 6; k++) old.push(['Civis Romanus sum', true]);
  await notebook('ラテン語練習帳　最後のページ', old, null, true);
  await flashback();
  hush(); await y2.rest(2); await drop('book', 'ラテン語練習帳', '全ページ使用済み');
  /* 埋め戻し、退場、水を戻す */
  al.hide(); setPit(0); sfx('thud'); await tick(5);
  await Promise.all([d1.walk(1400, 34), d2.walk(1400, 34), y2.walk(1400, 34), v2.walk(1400, 34)]);
  await narr('ヨルダネスによれば、墓を掘った捕虜たちは、場所を知りすぎたために殺された。墓の在りかを知る者は、こうして一人も残らなかった。');
  hush(); sign.remove(); ST.dam.innerHTML = ''; sfx('thud'); await tick(4);
  for (let k = 1; k <= 6; k++) { ST.setWater(k / 6); sfx('splash'); await tick(4); }
  caption('');
  for (let k = 0; k < 8; k++) { ST.setWater(1); await tick(4); }
  /* ぷくっ。ガハハ */
  const bb = E('circle', { cx: 640, cy: 548, r: 7, fill: 'rgba(234,223,198,.25)', stroke: '#eadfc6', 'stroke-width': 3 }, L.fg);
  let a = 0; for (let y = 548; y > 312; y -= 30) { a ^= 1; bb.setAttribute('cy', y); bb.setAttribute('cx', 640 + (a ? 7 : -7)); await tick(2); }
  bb.setAttribute('cy', 304); bb.setAttribute('cx', 640); bb.setAttribute('r', 13); sfx('puku');
  const pk = bubble([640, 268], 'ぷくっ', 'sm notail'); await sleep(1100);
  bb.remove(); pk.remove();
  const burst = ink(L.fg, 'M640,280 V262 M622,288 L608,274 M658,288 L672,274 M616,304 H598 M664,304 H682', 3, { stroke: '#eadfc6', opacity: 1 });
  sfx('gahaha'); const gh = bubble([640, 250], 'ガハハ', 'big'); await tick(3); burst.remove();
  await sleep(2600);
  await fade(1); gh.remove(); clearStage();
  return 'river';
}

/* ================= 結末の場面 ================= */
const ENDSCENE = {
  river: finale,
  async stilicho() {
    await fade(1); clearStage(); wall('#3a2a22', null); frieze(); caption('四〇八年　ラヴェンナ');
    const c1 = coin(L.mid, 440, 370, 140, 'stilicho', 'STILICHO · MAGISTER · MILITVM'), c2 = coin(L.mid, 840, 370, 140, 'alaric', 'ALARICVS · MAGISTER · MILITVM');
    await fade(0);
    await narr('粛清は、スティリコに近かった者の名簿に沿って進んだ。名簿は、よく整理されていた。');
    await narr('「西ローマ軍司令官　アラリック」の名は、上から数えたほうが早かった。');
    hush();
    for (const [x, y, r] of [[6, 8, 4], [14, 40, 14], [26, 110, 40], [30, 240, 75]]) { c1.headEl.setAttribute('transform', 'translate(' + x + ',' + y + ') rotate(' + r + ')'); await tick(2); c2.headEl.setAttribute('transform', 'translate(' + x + ',' + y + ') rotate(' + r + ')'); await tick(2); }
    sfx('bad'); const t = tag(640, 600, '仲良く、首から先に退場', '中は、暖かかった'); await sleep(2200); $('#next').style.visibility = 'visible'; await waitClick(); $('#next').style.visibility = 'hidden'; t.remove();
    await fade(1); clearStage();
  },
  async senate() {
    await scene('senate'); caption('四一〇年　ローマ　元老院');
    const al = cast({ hair: '#b08a3e', style: 'long', beard: true, toga: true, tunic: '#e4dac4', stripe: true }, 640, 1);
    let t = tag(640, 330, '元老院議員　フラウィウス・アラリクス', '発言回数：0');
    await narr('アラリックはローマ人になった。トーガの着方は、三年かけて覚えた。');
    await narr('取り立てをやめたので、誰も彼を恐れなくなった。恐れなくなったので、誰も彼に払わなくなった。');
    hush();
    for (const [yr, col, nm] of [['四二〇年', '#9c8a5e', '元老院議員　フ　ウィ　ス・ア　リ　ス'], ['四三〇年', '#b5ad9c', '元老院議員　　　　　　　　・　　　　　'], ['四四〇年', '#d6d0c2', '空席']]) {
      caption(yr + '　ローマ　元老院'); al.face.hair.setAttribute('fill', col); if (al.face.beard) al.face.beard.setAttribute('fill', col); al.set({ head: al.p.head + 7, rot: al.p.rot + 2 });
      t.remove(); t = tag(640, 330, nm, '発言回数：0'); sfx('flip'); await sleep(1700);
    }
    await narr('彼は無事に老いた。葬儀は滞りなく行われ、墓は翌年には見つからなくなった。探す者が、いなかったからである。');
    await fade(1); clearStage();
  },
  async hunger() {
    await scene('road', true); caption('どこかの街道');
    const al = cast('alaric', 700, 1), gs = [cast('young', 560, 1), cast('veteran', 440, 1), cast('goth', 320, 1)];
    await narr('空腹の軍隊は、肩書きを食べられなかった。');
    await say(gs[1], '古参の戦士', '王よ。任命状は、煮ても焼いても羊皮紙でした。');
    hush();
    for (const g of gs.slice().reverse()) { await g.walk(-120, 34); }
    await narr('戦士たちは、食わせてくれる別の王を探しに行った。');
    hush(); await al.walk(1000, 20);
    await narr('アラリックは一人で、ローマの道を歩いた。道は相変わらず、石でできていた。');
    await fade(1); clearStage();
  }
};

/* ================= 進行 ================= */
async function main() {
  makeGrain(); coinSvg($('#neck'), 'alaric'); hud();
  const start = Q.has('ch') ? Math.max(0, Math.min(8, +Q.get('ch') || 0)) : await title();
  preset(start);
  const CH = [prologue, ch1, ch2, ch3, ch4, ch5, ch6, ch7, ch8];
  for (let i = start; i < CH.length; i++) {
    if (i >= 2 && i <= 7 && G.belly <= 2) { hush(); await line('古参の戦士', '王よ。兵の腹が鳴っております。肩書きは、煮ても食えません。', ''); }
    let r = await CH[i]();
    if (!r && i >= 1 && i <= 7) { gain({ belly: -1 }); await sleep(900); if (G.belly <= 0) r = 'hunger'; }
    if (r) { await ENDSCENE[r](); await ending(r); return; }
  }
}
main().catch(e => { console.error(e); window.__error = String(e && e.stack || e); });
</script>
